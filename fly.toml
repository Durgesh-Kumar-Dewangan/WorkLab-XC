# fly launch --copy-config --no-deploy, then: fly secrets set SESSION_SECRET=... CRON_SECRET=... DATABASE_URL=... (see DEPLOY.md)
app = "worklab-xc"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_URL = "https://worklabxc.com"
  NODE_ENV = "production"
  TRUST_PROXY = "1"
  WORKER_MODE = "inline"
  LLM_ORDER = "azure,openai,gemini,groq,mistral,openrouter,cloudflare,compat"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
