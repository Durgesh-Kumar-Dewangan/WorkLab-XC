# From backend/:  fly launch --copy-config --no-deploy ; fly secrets set SESSION_SECRET=... CRON_SECRET=... DATABASE_URL=... ; fly deploy
# Deploy the front end separately (root Dockerfile) with build arg API_ORIGIN=https://worklab-xc-api.fly.dev
app = "worklab-xc-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_URL = "https://worklabxc.com"
  WLXC_ENV = "production"
  TRUST_PROXY = "1"
  WORKER_MODE = "inline"
  INPROCESS_TICK_SEC = "30"
  WEB_CONCURRENCY = "1"
  LLM_ORDER = "azure,openai,gemini,groq,mistral,openrouter,cloudflare,compat"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
